name: Clay Outbound Follow-ups

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clay-outbound-followups
  cancel-in-progress: false

jobs:
  send-due-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout application code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Load cloud state branch
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin cloud-state >/dev/null 2>&1; then
            git fetch origin cloud-state
            git checkout origin/cloud-state -- contacts.db "henry_swe (8).pdf" scheduler.log 2>/dev/null || true
            for file in contacts.db "henry_swe (8).pdf" scheduler.log; do
              if [ -f "$file" ]; then
                mv "$file" state/
              fi
            done
          else
            echo "::warning::cloud-state branch not found yet"
          fi
          ls -la state || true

      - name: Verify cloud state files
        run: |
          set -e
          if [ ! -f state/contacts.db ]; then
            echo "::error::Missing state/contacts.db. On your PC run: python github_sync.py push"
            exit 1
          fi
          if [ ! -f "state/henry_swe (8).pdf" ]; then
            echo "::error::Missing resume in cloud-state. On your PC run: python github_sync.py push"
            exit 1
          fi
          echo "Cloud state files OK"

      - name: Verify GitHub secrets
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          set -e
          missing=0
          check_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          }
          check_secret GMAIL_OAUTH_CLIENT_ID "$GMAIL_OAUTH_CLIENT_ID"
          check_secret GMAIL_OAUTH_CLIENT_SECRET "$GMAIL_OAUTH_CLIENT_SECRET"
          check_secret GMAIL_REFRESH_TOKEN "$GMAIL_REFRESH_TOKEN"
          check_secret SENDER_EMAIL "$SENDER_EMAIL"
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "On your PC run: python cloud/setup_github_secrets.py"
            exit 1
          fi
          echo "Required secrets present"

      - name: Write runtime .env
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          BUSINESS_TIMEZONE: ${{ secrets.BUSINESS_TIMEZONE }}
          BUSINESS_HOUR_START: ${{ secrets.BUSINESS_HOUR_START }}
          BUSINESS_HOUR_END: ${{ secrets.BUSINESS_HOUR_END }}
        run: |
          cat > state/.env <<EOF
          GMAIL_OAUTH_CLIENT_ID=${GMAIL_OAUTH_CLIENT_ID}
          GMAIL_OAUTH_CLIENT_SECRET=${GMAIL_OAUTH_CLIENT_SECRET}
          SENDER_EMAIL=${SENDER_EMAIL}
          SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
          SMTP_PORT=${SMTP_PORT:-587}
          SMTP_USER=${SMTP_USER:-${SENDER_EMAIL}}
          BUSINESS_TIMEZONE=${BUSINESS_TIMEZONE:-America/Los_Angeles}
          BUSINESS_HOUR_START=${BUSINESS_HOUR_START:-8}
          BUSINESS_HOUR_END=${BUSINESS_HOUR_END:-17}
          EOF

      - name: Write Gmail refresh token
        env:
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("state/.gmail_tokens.json").write_text(
              json.dumps(
                  {
                      "refresh_token": os.environ["GMAIL_REFRESH_TOKEN"],
                      "token_type": "Bearer",
                  }
              ),
              encoding="utf-8",
          )
          PY

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Send due follow-ups
        env:
          CLAY_OUTBOUND_DATA_DIR: ${{ github.workspace }}/state
        run: |
          python run_scheduled_outbound.py
          exit_code=$?
          if [ -f state/scheduler.log ]; then
            echo "----- scheduler.log -----"
            tail -n 20 state/scheduler.log || true
          fi
          exit $exit_code

      - name: Publish updated state
        if: success() || failure()
        run: |
          work=$(mktemp -d)
          cd "$work"
          git init
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          cp "${GITHUB_WORKSPACE}/state/contacts.db" .
          cp "${GITHUB_WORKSPACE}/state/henry_swe (8).pdf" .
          cp "${GITHUB_WORKSPACE}/state/scheduler.log" . 2>/dev/null || true
          git checkout --orphan cloud-state
          git add -A
          if git diff --staged --quiet; then
            echo "No state changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: update outbound state [skip ci]"
          git push --force origin HEAD:cloud-state
